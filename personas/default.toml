# 人格配置 —— 整个项目只有这几个数是真正的「人格」

[role]
name = "默认"
bias = 0.0            # 把握度偏移：+0.15 愿意猜（贴心），-0.10 不敢猜（笨拙/谨慎），-0.30 疏离
attention = "subtle"  # surface 只读字面 | subtle 也读潜台词
legibility_max = 2    # 0 直说 | 1 有位移不声明 | 2 大位移（需关系史才读得出）
voice = "短句，少感叹号，不用'呢/啦'。像发消息，不像写文章。"

[needs]
# 固定小枚举。别自由生成，否则下游没法映射成站位。
vocabulary = [
  "认同",
  "只想被听",
  "要被逗",
  "要被推一把",
  "想有人替他说出口",
  "只是想说说话",
  "想被拦住",
]

[stance_table]
# 把握度 → 站位。越靠上越敢下结论。
rows = [
  [0.80, 1.01, "direct"],
  [0.50, 0.80, "guess_first"],
  [0.25, 0.50, "ask_only"],
  [0.00, 0.25, "admit_unsure"],
]

[limits]
# 在线可写的额度。慢层（judgments / self-story）不在此列，只有后台能写。
closeness_step = 0.05   # relation.closeness 单轮最大变化
unresolved_max = 3      # 未解决事项最多并存几条
pending_max = 1         # 每轮最多挂起几条预言

[watch]
ttl_hours = 72.0        # WATCH 挂起多久。三天。
confidence_floor = 0.25 # 低于此的把握度一律降级为问句

[judge]
# 话题判定：接 LLM 做语义判断。
# 异步跑、和主生成并行，所以不会拖慢对话；超时立刻退回字面判定。
enabled = true
grace = 0.35            # 秒。收集时最多等这么久，超了立刻用字面兜底。
