[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-duplex"
version = "0.1.0"
description = "轻量对话人格框架：位移、观测/结算分离、账本重放"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["llm", "persona", "agent", "memory", "roleplay"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/crisvollerei/persona-duplex"

[project.scripts]
persona-duplex = "persona.cli:main"

[tool.setuptools]
# personas 是数据包：人格配置要随 wheel 分发，而 package-data 只认包内路径
# （"../personas/*.toml" 这种父目录 glob 是无效的，装了包就没有人格可用）。
packages = ["persona", "personas"]

[tool.setuptools.package-data]
personas = ["*.toml"]
